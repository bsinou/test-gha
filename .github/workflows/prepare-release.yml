name: Prepare release

# Test-harness mirror of wire-team-settings' prepare-release.yml (ADR 0006
# PREPARED -> VALIDATED -> PUBLISHED process). Identical version-computation
# and integrity mechanics; the Docker/Helm candidate "publication" steps are
# mocked to log-only since this repo has no real registry/S3 to push to.
#
# The PREPARED candidate is a draft GitHub Release: no branch, no commit.
# The changelog becomes the release body and the release manifest becomes a
# release asset — both belong to the release, not to the code.

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch to release from'
        required: true
        type: choice
        default: main
        options:
          - main
          - release/0.1
          - release/0.2
          - release/1.0
      type:
        description: 'Release channel'
        type: choice
        options: [ga, alpha, beta, rc]
        default: ga
        required: true
      version_bump:
        description: 'Applies whenever promoting from a GA, for any type (ga, alpha, beta, rc). Ignored when the latest reachable release is already a pre-release, and when promoting an existing pre-release to GA'
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true

permissions: {}

concurrency:
  group: prepare-release-${{ inputs.source_branch }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v7
        with:
          ref: ${{ inputs.source_branch }}
          fetch-depth: 0

      - name: Resolve source commit
        id: source
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Resolved source_branch '${{ inputs.source_branch }}' to $sha"

      - name: Compute target version
        id: version
        run: |
          set -euo pipefail
          target=$(./bin/compute-release-version.sh "${{ inputs.source_branch }}" "${{ inputs.type }}" "${{ inputs.version_bump }}")

          # Changelog boundary: GA releases summarize everything since the last
          # GA; pre-releases summarize everything since the last pre-release
          # (any channel), falling back to the last GA for the first pre-release
          # of a new cycle.
          if [[ "${{ inputs.type }}" == "ga" ]]; then
            from_tag=$(git describe --tags --match "v[0-9]*.[0-9]*.[0-9]*" --exclude "v*-*" --abbrev=0 "origin/${{ inputs.source_branch }}")
          else
            from_tag=$(git describe --tags --match "v[0-9]*.[0-9]*.[0-9]*-*" --abbrev=0 "origin/${{ inputs.source_branch }}" 2>/dev/null || \
              git describe --tags --match "v[0-9]*.[0-9]*.[0-9]*" --exclude "v*-*" --abbrev=0 "origin/${{ inputs.source_branch }}")
          fi

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "from_tag=$from_tag" >> "$GITHUB_OUTPUT"
          echo "Target version: $target (changelog from $from_tag)"

      - name: Fail if a release already exists for this version
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.version.outputs.target }}
        run: |
          set -euo pipefail

          # /releases/tags/<tag> does not return drafts — must list and filter.
          matches="$(
            gh api --paginate "/repos/${{ github.repository }}/releases" \
              --jq "[.[] | select(.tag_name == \"v${TARGET}\") | {url: .html_url, draft: .draft}]"
          )"
          count="$(jq 'length' <<<"$matches")"

          if [[ "$count" -gt 0 ]]; then
            url="$(jq -r '.[0].url' <<<"$matches")"
            state="$(jq -r 'if .[0].draft then "draft" else "published" end' <<<"$matches")"

            echo "::error title=Release already exists::A ${state} release already exists for v${TARGET}: ${url}"

            {
              echo "### Release already in progress"
              echo ""
              echo "A ${state} release already exists for \`v${TARGET}\`:"
              echo ""
              echo "➡️ [v${TARGET}](${url})"
              echo ""
              echo "Delete the draft to re-prepare, or publish it to complete the release."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi

          echo "No existing release found for v${TARGET}."

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install changelog dependencies
        run: npm ci

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install changelog dependencies
        run: npm ci

      - name: Generate changelog
        run: |
          set -euo pipefail
          node bin/generate-release-changelog.js "${{ steps.version.outputs.from_tag }}" "${{ steps.source.outputs.sha }}"
          cp CHANGELOG.md /tmp/release-notes.md

      - name: Build production bundle (mocked — no real build in this test repo)
        env:
          APP_VERSION: ${{ steps.version.outputs.target }}
        run: echo "[MOCK] Would build production bundle for APP_VERSION=$APP_VERSION"

      - name: Push candidate Docker image (mocked — publication is not performed in this test repo)
        id: docker
        run: |
          set -euo pipefail
          repo="quay.io/wire/team-settings"
          candidate_tag="${{ steps.version.outputs.target }}-candidate"
          digest="sha256:$(echo -n "${{ steps.source.outputs.sha }}" | sha256sum | cut -d' ' -f1)"

          echo "repository=$repo" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=$candidate_tag" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "[MOCK] Would push Docker candidate image: ${repo}:${candidate_tag} @ ${digest}"

      - name: Package candidate Helm chart (mocked — publication is not performed in this test repo)
        id: helm
        run: |
          set -euo pipefail
          target="${{ steps.version.outputs.target }}"
          package_file="team-settings-${target}.tgz"
          sha256=$(echo -n "$target" | sha256sum | cut -d' ' -f1)
          candidate_path="candidates/${package_file}"

          echo "candidate_path=$candidate_path" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "[MOCK] Would upload Helm candidate chart to s3://public.wire.com/charts-webapp/${candidate_path} (sha256 $sha256)"

      - name: Write release manifest
        run: |
          set -euo pipefail
          cat > /tmp/release-manifest.json <<JSON
          {
            "version": "${{ steps.version.outputs.target }}",
            "type": "${{ inputs.type }}",
            "source_branch": "${{ inputs.source_branch }}",
            "source_commit": "${{ steps.source.outputs.sha }}",
            "docker_repository": "${{ steps.docker.outputs.repository }}",
            "docker_candidate_tag": "${{ steps.docker.outputs.candidate_tag }}",
            "docker_digest": "${{ steps.docker.outputs.digest }}",
            "helm_candidate_path": "${{ steps.helm.outputs.candidate_path }}",
            "helm_sha256": "${{ steps.helm.outputs.sha256 }}",
            "prepare_run_id": "${{ github.run_id }}"
          }
          JSON
          cat /tmp/release-manifest.json

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.version.outputs.target }}
        run: |
          set -euo pipefail

          # Re-check right before creating: GitHub permits multiple drafts with
          # the same tag_name, so create-without-check can silently duplicate.
          count="$(gh api --paginate "/repos/${{ github.repository }}/releases" \
            --jq "[.[] | select(.tag_name == \"v${TARGET}\")] | length")"
          if [[ "$count" -ne 0 ]]; then
            echo "::error title=Race detected::A release for v${TARGET} appeared during this run — aborting"
            exit 1
          fi

          {
            echo "Release candidate for \`${TARGET}\` (\`${{ inputs.type }}\`) from \`${{ inputs.source_branch }}\` @ \`${{ steps.source.outputs.sha }}\`."
            echo ""
            echo "[MOCK] Candidate artifacts are simulated in this test repo (no real registry/S3 push), recorded in the \`release-manifest.json\` asset:"
            echo "- Docker: \`${{ steps.docker.outputs.repository }}:${{ steps.docker.outputs.candidate_tag }}\` (\`${{ steps.docker.outputs.digest }}\`)"
            echo "- Helm: \`${{ steps.helm.outputs.candidate_path }}\` (sha256 \`${{ steps.helm.outputs.sha256 }}\`)"
            echo ""
            echo "**Review this draft, then click _Publish release_** — that creates the tag \`v${TARGET}\` at \`${{ steps.source.outputs.sha }}\` and runs \`publish-release\`, which promotes the artifacts above without rebuilding. To abandon this candidate, delete this draft."
            echo ""
            echo "---"
            echo ""
            cat /tmp/release-notes.md
          } > /tmp/release-body.md

          args=(--draft
                --target "${{ steps.source.outputs.sha }}"
                --title "v${TARGET}"
                --notes-file /tmp/release-body.md)
          if [[ "${{ inputs.type }}" != "ga" ]]; then args+=(--prerelease); fi

          # gh release create prints the release's URL on success — use that
          # directly. Re-querying the releases list right after creation is
          # unreliable: it can momentarily miss the just-created release
          # (list-endpoint propagation lag), and "gh api --jq" silently
          # returns empty (not an error) when nothing matches, which would
          # produce an empty markdown link — one that browsers resolve to
          # the current page instead of failing visibly.
          url="$(gh release create "v${TARGET}" "${args[@]}" /tmp/release-manifest.json)"

          {
            echo "### Draft release ready"
            echo ""
            echo "➡️ [v${TARGET}](${url})"
            echo ""
            echo "Review it and click **Publish release** to complete the release."
          } >> "$GITHUB_STEP_SUMMARY"
