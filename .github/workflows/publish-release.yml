name: Publish release

# Test-harness mirror of wire-team-settings' publish-release.yml (ADR 0006
# publication step). Identical verification/tag/release mechanics; the
# Docker/Helm "promotion" steps are mocked to log-only since this repo has
# no real registry/S3 to promote to.
#
# The PREPARED candidate is a draft GitHub Release created by prepare-release.
# Publication is triggered either automatically when that draft is published
# (a human clicked "Publish release"), or manually as a fallback.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.0.1 or 1.1.0-rc01 (leading v optional). Manual fallback — normally the draft is published from the Releases page.'
        type: string
        required: true

permissions: {}

jobs:
  # ── 1. RESOLVE RELEASE ───────────────────────────────────────────────────────
  resolve-release:
    name: Resolve release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    outputs:
      target: ${{ steps.release.outputs.target }}
      release_id: ${{ steps.release.outputs.release_id }}
      is_draft: ${{ steps.release.outputs.is_draft }}
      target_commitish: ${{ steps.release.outputs.target_commitish }}
      manifest_asset_url: ${{ steps.release.outputs.manifest_asset_url }}

    steps:
      - name: Look up release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RAW_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
        run: |
          set -euo pipefail
          target="${RAW_VERSION#v}"

          # /releases/tags/<tag> does not return drafts — must list and filter.
          matches="$(
            gh api --paginate "/repos/${{ github.repository }}/releases" \
              --jq "[.[] | select(.tag_name == \"v${target}\")]"
          )"
          count="$(jq 'length' <<<"$matches")"

          if [[ "$count" -eq 0 ]]; then
            echo "::error title=No release found::No release found for v${target} — run prepare-release first."
            exit 1
          fi
          if [[ "$count" -gt 1 ]]; then
            echo "::error title=Multiple releases found::Multiple releases share tag v${target} — resolve manually:"
            jq -r '.[] | "  - \(.html_url)"' <<<"$matches" >&2
            exit 1
          fi

          release_id="$(jq -r '.[0].id' <<<"$matches")"
          is_draft="$(jq -r '.[0].draft' <<<"$matches")"
          target_commitish="$(jq -r '.[0].target_commitish' <<<"$matches")"
          # browser_download_url 404s for a draft's assets — must use the API url.
          manifest_asset_url="$(jq -r '.[0].assets[] | select(.name == "release-manifest.json") | .url' <<<"$matches")"

          if [[ -z "$manifest_asset_url" ]]; then
            echo "::error title=No manifest asset::Release v${target} has no release-manifest.json asset; it was not produced by prepare-release."
            exit 1
          fi

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "is_draft=$is_draft" >> "$GITHUB_OUTPUT"
          echo "target_commitish=$target_commitish" >> "$GITHUB_OUTPUT"
          echo "manifest_asset_url=$manifest_asset_url" >> "$GITHUB_OUTPUT"
          echo "Release v${target}: id=$release_id draft=$is_draft target_commitish=$target_commitish"

  # ── 2. PUBLISH ───────────────────────────────────────────────────────────────
  publish:
    name: Publish
    needs: resolve-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Download release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/octet-stream" \
            "${{ needs.resolve-release.outputs.manifest_asset_url }}" \
            > /tmp/release-manifest.json
          jq . /tmp/release-manifest.json

      - name: Read and verify release manifest
        id: manifest
        run: |
          set -euo pipefail

          for key in version type source_branch source_commit docker_repository docker_candidate_tag docker_digest helm_candidate_path helm_sha256; do
            value=$(jq -r ".$key" /tmp/release-manifest.json)
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done

          version="$(jq -r '.version' /tmp/release-manifest.json)"
          if [[ "$version" != "${{ needs.resolve-release.outputs.target }}" ]]; then
            echo "error: manifest version $version does not match resolved release v${{ needs.resolve-release.outputs.target }}" >&2
            exit 1
          fi

          source_commit="$(jq -r '.source_commit' /tmp/release-manifest.json)"
          if [[ "$source_commit" != "${{ needs.resolve-release.outputs.target_commitish }}" ]]; then
            echo "error: manifest source_commit $source_commit does not match the release's target_commitish ${{ needs.resolve-release.outputs.target_commitish }} — the draft was retargeted after preparation" >&2
            exit 1
          fi

          echo "Verified manifest for version $version @ ${source_commit:0:7}"

      - name: Checkout source branch
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v7
        with:
          ref: ${{ steps.manifest.outputs.source_branch }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Verify candidate is still on its source branch
        run: |
          set -euo pipefail
          source_commit="${{ steps.manifest.outputs.source_commit }}"
          source_branch="${{ steps.manifest.outputs.source_branch }}"
          if ! git merge-base --is-ancestor "$source_commit" "origin/${source_branch}"; then
            echo "::error title=Stale candidate::source_commit ${source_commit} is no longer an ancestor of ${source_branch} — the branch was rewritten since preparation. Delete this release and re-run prepare-release."
            exit 1
          fi
          echo "Candidate ${source_commit} is still reachable from ${source_branch}."

      - name: Promote Docker image (mocked — publication is not performed in this test repo)
        run: |
          set -euo pipefail
          repo="${{ steps.manifest.outputs.docker_repository }}"
          candidate_ref="${repo}:${{ steps.manifest.outputs.docker_candidate_tag }}"
          release_ref="${repo}:${{ steps.manifest.outputs.version }}"
          expected_digest="${{ steps.manifest.outputs.docker_digest }}"

          echo "[MOCK] Would verify candidate digest for $candidate_ref matches $expected_digest"
          echo "[MOCK] Would promote (no rebuild): $candidate_ref -> $release_ref"

      - name: Promote Helm chart (mocked — publication is not performed in this test repo)
        run: |
          set -euo pipefail
          target="${{ steps.manifest.outputs.version }}"
          expected_sha256="${{ steps.manifest.outputs.helm_sha256 }}"
          package_file="team-settings-${target}.tgz"

          echo "[MOCK] Would fetch s3://public.wire.com/charts-webapp/${{ steps.manifest.outputs.helm_candidate_path }} and verify sha256 $expected_sha256"
          echo "[MOCK] Would publish $package_file to charts-webapp"

      - name: Create immutable release tag
        run: |
          set -euo pipefail
          target="${{ steps.manifest.outputs.version }}"
          source_commit="${{ steps.manifest.outputs.source_commit }}"

          git fetch --tags --force origin

          if git rev-parse -q --verify "refs/tags/v${target}" >/dev/null; then
            existing=$(git rev-parse "refs/tags/v${target}")
            if [[ "$existing" == "$source_commit" ]]; then
              echo "Tag v${target} already exists at the expected commit — treating as already completed."
            else
              echo "error: tag v${target} already exists at $existing, expected $source_commit — refusing to move an existing release tag" >&2
              exit 1
            fi
          else
            git tag "v${target}" "$source_commit"
            git push origin "v${target}"
            echo "Created tag v${target} at $source_commit"
          fi

      - name: Create or verify release/X.Y for first GA of a new minor
        if: steps.manifest.outputs.type == 'ga'
        run: |
          set -euo pipefail
          target="${{ steps.manifest.outputs.version }}"
          source_commit="${{ steps.manifest.outputs.source_commit }}"

          if [[ "$target" =~ ^([0-9]+)\.([0-9]+)\.0$ ]]; then
            line="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            if git ls-remote --exit-code --heads origin "release/${line}" >/dev/null 2>&1; then
              existing=$(git ls-remote --heads origin "release/${line}" | awk '{print $1}')
              if [[ "$existing" == "$source_commit" ]]; then
                echo "release/${line} already exists at the expected commit — treating as already completed."
              else
                echo "error: release/${line} already exists at $existing, expected $source_commit — refusing to move an existing maintenance branch" >&2
                exit 1
              fi
            else
              git push origin "${source_commit}:refs/heads/release/${line}"
              echo "Created release/${line} at $source_commit"
            fi
          else
            echo "Not the first GA of a new minor (patch != 0) — no maintenance branch created."
          fi

      - name: Publish draft release
        env:
          # Must be github.token: the resulting release event must NOT re-trigger
          # this workflow (GITHUB_TOKEN-caused events never start workflow runs).
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ needs.resolve-release.outputs.is_draft }}" != "true" ]]; then
            echo "Release v${{ steps.manifest.outputs.version }} is already published — treating as already completed."
            exit 0
          fi
          gh api --method PATCH \
            "/repos/${{ github.repository }}/releases/${{ needs.resolve-release.outputs.release_id }}" \
            -F draft=false --jq '.html_url'

      - name: Re-draft release on failure
        if: failure() && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="${{ needs.resolve-release.outputs.target }}"
          gh api --method PATCH \
            "/repos/${{ github.repository }}/releases/${{ needs.resolve-release.outputs.release_id }}" \
            -F draft=true >/dev/null
          git push --delete origin "v${target}" || true
          echo "::error title=Publication failed::Release v${target} was reverted to draft and its tag deleted. Fix the cause and publish again."
